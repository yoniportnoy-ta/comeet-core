[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comeet-core"
version = "0.1.0"
description = "One Comeet Recruiting API client for every Riverside service"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyJWT>=2.8",
    "tenacity>=8.2",
]

[tool.setuptools.packages.find]
where = ["src"]
